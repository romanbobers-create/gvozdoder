backend:
  name: github
  repo: romanbobers-create/gvozdoder
  branch: main
  base_url: https://gvozdoder.pages.dev
  auth_endpoint: api/auth

media_folder: "uploads"
public_folder: "/uploads"

collections:
  # МУЗЫКА (общая)
  - name: "music"
  label: "Музыка"
  folder: "content/music"
  create: true
  slug: "{{slug}}"
  media_folder: "uploads/music"      # папка для аудиофайлов (относительно корня репозитория)
  public_folder: "/uploads/music"    # публичный URL
  fields:
    - {label: "Название трека", name: "title", widget: "string"}
    - {label: "Аудиофайл", name: "audio", widget: "file", media_library: { config: { max_file_size: 10485760 } }}
    - {label: "Обложка", name: "cover", widget: "image", required: false}
    - {label: "Альбом", name: "album", widget: "string", required: false}
    - {label: "Текст песни", name: "lyrics", widget: "markdown", required: false}
  # КОНЦЕРТЫ (общие)
  - name: "gigs"
    label: "Концерты"
    folder: "content/gigs"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - {label: "Название", name: "title", widget: "string"}
      - {label: "Дата", name: "date", widget: "datetime"}
      - {label: "Афиша", name: "poster", widget: "image"}
      - {label: "Ссылка на билеты", name: "link", widget: "string"}
      - {label: "Место проведения", name: "place", widget: "string"}

  # УЧАСТНИКИ (RU)
  - name: "members_ru"
    label: "Участники (RU)"
    folder: "content/members/ru"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Имя", name: "name", widget: "string"}
      - {label: "Роль", name: "role", widget: "string"}
      - {label: "Фото", name: "image", widget: "string", default: "/css/img/bydlo.png"}
      - {label: "Биография", name: "bio", widget: "markdown"}

  # УЧАСТНИКИ (EN)
  - name: "members_en"
    label: "Members (EN)"
    folder: "content/members/en"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Name", name: "name", widget: "string"}
      - {label: "Role", name: "role", widget: "string"}
      - {label: "Photo", name: "image", widget: "string", default: "/css/img/bydlo.png"}
      - {label: "Biography", name: "bio", widget: "markdown"}

  # МЕРЧ (общий)
  - name: "shop"
    label: "Мерч"
    folder: "content/shop"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Название товара", name: "title", widget: "string"}
      - {label: "Описание", name: "description", widget: "text"}
      - {label: "Цена", name: "price", widget: "number"}
      - {label: "Фото", name: "image", widget: "image"}

  # ГАЛЕРЕЯ (общая)
  - name: "gallery"
    label: "Галерея"
    folder: "content/gallery"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Название альбома", name: "title", widget: "string"}
      - {label: "Фотографии", name: "images", widget: "list", field: {label: "Фото", name: "image", widget: "image"}}

  # ВИДЕО КАТЕГОРИИ (исправленный блок)
  - name: "video_categories"
    label: "Категории видео"
    folder: "content/video_categories"
    create: true
    slug: "{{slug}}"
    fields:
      - label: "Название категории"
        name: "title"
        widget: "string"
      - label: "Видео"
        name: "videos"
        widget: "list"
        fields:
          - label: "Название видео"
            name: "video_title"
            widget: "string"
          - label: "Код для вставки (iframe)"
            name: "embed_code"
            widget: "text"
          - label: "Описание"
            name: "description"
            widget: "text"
            required: false

  # КАРТА (общая)
  - name: "map"
    label: "Карта выступлений"
    folder: "content/map"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Название места", name: "title", widget: "string"}
      - {label: "Широта", name: "lat", widget: "number", value_type: "float"}
      - {label: "Долгота", name: "lng", widget: "number", value_type: "float"}
      - {label: "Дата", name: "date", widget: "datetime"}
      - {label: "Описание", name: "description", widget: "text"}
      - {label: "Фото", name: "image", widget: "image", required: false}
      - {label: "Ссылка на событие", name: "link", widget: "string", required: false}

  # НОВОСТИ (RU)
  - name: "news_ru"
    label: "Новости (RU)"
    folder: "content/news/ru"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - {label: "Заголовок", name: "title", widget: "string"}
      - {label: "Дата", name: "date", widget: "datetime"}
      - {label: "Текст", name: "body", widget: "markdown"}
      - {label: "Изображение", name: "image", widget: "image", required: false}

  # НОВОСТИ (EN)
  - name: "news_en"
    label: "News (EN)"
    folder: "content/news/en"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Date", name: "date", widget: "datetime"}
      - {label: "Body", name: "body", widget: "markdown"}
      - {label: "Image", name: "image", widget: "image", required: false}

  # СТРАНИЦА "О ГРУППЕ" (RU)
  - name: "about_ru"
    label: "О группе (RU)"
    folder: "content/about/ru"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Текст", name: "body", widget: "markdown"}

  # СТРАНИЦА "О ГРУППЕ" (EN)
  - name: "about_en"
    label: "About (EN)"
    folder: "content/about/en"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Text", name: "body", widget: "markdown"}
